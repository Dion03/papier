name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check            # typecheck, contrast, unit + axe tests, build
  react18:
    # The peer dependency promises React 18 too, so the unit, axe and SSR tests also run on it.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --no-save react@18 react-dom@18
      - run: npx vitest run
  browsers:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:docs
      # Screenshots depend on the OS font renderer; baselines are checked locally (npm run test:e2e).
      - run: npx playwright test --ignore-snapshots
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: test-results }
