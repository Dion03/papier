name: Release
on:
  push: { tags: ['v*'] }
permissions:
  contents: write
  id-token: write   # npm trusted publishing (OIDC) and provenance, no token needed
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1 or newer
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
      - name: GitHub release with the changelog entry
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Papier $v" --notes-file notes.md
        env: { GH_TOKEN: '${{ github.token }}' }
